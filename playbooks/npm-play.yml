---
- name: Create folders on dev servers
  hosts: dev
  tasks:
    - name: Create application directory
      file:
        path: /home/ubuntu/app
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Create logs directory
      file:
        path: /home/ubuntu/app/logs
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Create uploads directory
      file:
        path: /home/ubuntu/app/uploads
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'
